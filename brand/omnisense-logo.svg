<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242655"/>
      <stop offset="1" stop-color="#3a3686"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="232" r="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9b8bf7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9b8bf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="150" y1="120" x2="380" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ddd0ff"/>
      <stop offset="1" stop-color="#8573f5"/>
    </linearGradient>
    <linearGradient id="core" x1="226" y1="226" x2="286" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cafff3"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="beam" x1="256" y1="256" x2="382" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- inner subtle ring (depth) -->
  <circle cx="256" cy="256" r="118" fill="none" stroke="#b8b0ff" stroke-opacity="0.16" stroke-width="6"/>

  <!-- ring outer glow for contrast at small sizes -->
  <path d="M 193.5 390.1 A 148 148 0 1 1 318.5 390.1" fill="none" stroke="#8b7cf5" stroke-opacity="0.4" stroke-width="36" stroke-linecap="round"/>

  <!-- aperture ring with a gap at the top (O / radar opening) -->
  <path d="M 193.5 390.1 A 148 148 0 1 1 318.5 390.1" fill="none" stroke="url(#ring)" stroke-width="28" stroke-linecap="round"/>

  <!-- sense sweep wedge (active local sensing) -->
  <path d="M256 256 L 378.9 170 A 150 150 0 0 1 378.9 342 Z" fill="url(#beam)" opacity="0.45"/>

  <!-- teal active-arc highlight on the ring -->
  <path d="M 395.1 306.6 A 148 148 0 0 1 281.7 401.8" fill="none" stroke="#5eead4" stroke-width="28" stroke-linecap="round"/>

  <!-- memory capsule nodes on the ring (subtle, mostly large-size detail) -->
  <circle cx="140.6" cy="300.1" r="7" fill="#5eead4" fill-opacity="0.65"/>
  <circle cx="371.0" cy="141.0" r="5" fill="#5eead4" fill-opacity="0.45"/>

  <!-- central local core -->
  <circle cx="256" cy="256" r="54" fill="url(#core)"/>
  <circle cx="256" cy="256" r="54" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="240" cy="240" r="15" fill="#ffffff" fill-opacity="0.5"/>
</svg>
